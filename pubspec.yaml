name: stockshaala
description: StockShaala - Indian Stock Market Learning App (Educational Only)
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1
  firebase_remote_config: ^5.5.0
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0

  # Local storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0

  # Network
  dio: ^5.5.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  package_info_plus: ^8.0.0
  fpdart: ^1.1.0

  # In-app update / review
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9

  # UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Ads
  google_mobile_ads: ^5.2.0

  # Video
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#08101E"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/fonts/
